# Values here are read by build.gradle and by the mods.toml template below
# (Forge's build tooling substitutes ${mod_id}, ${mod_version}, etc. at
# build time). Keeping them in one place means renaming your mod is mostly
# a matter of editing this file instead of hunting through every source file.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Mod properties
mod_id=examplemod
mod_name=Example Mod
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=A minimal Forge mod template for Minecraft 1.20.1, meant as a learning reference.

## Minecraft / Forge versions this mod is built against
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
